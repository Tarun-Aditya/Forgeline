  /* top bar */
  .bar { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }

  .bar nav a:hover { color: var(--text); background: var(--panel); }

  /* hero */
  header.hero { padding: 40px 0 8px; }
  .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 12px var(--mono); color: var(--muted); }
  .kind { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
  .kind.recap { color: var(--green); border-color: var(--green); background: var(--green-f); }
  .kind.plan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-f); }
  .kind.explore { color: var(--violet); border-color: var(--violet); background: var(--violet-f); }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; margin: 14px 0 8px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 18px; max-width: 820px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { display: flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; }
  .stat b { font: 700 17px var(--mono); }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .stat.add b { color: var(--green); } .stat.del b { color: var(--rose); }

  section { padding: 26px 0 8px; scroll-margin-top: 60px; }
  h2 { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  h2 .count { color: var(--dim); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
  .prose p { margin: 0 0 12px; max-width: 860px; } .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .summary { padding: 20px 22px; font-size: 16px; }

  /* key changes + files */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } .split > aside { position: sticky; top: 64px; } }
  .changes { display: grid; gap: 10px; }
  .change { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 18px; }
  .change .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--panel-2); border: 1px solid var(--border-2); color: var(--muted); }
  .change h3 { margin: 2px 0 4px; font-size: 16px; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .change .detail { color: var(--muted); font-size: 14.5px; }
  .tag { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .t-added, .t-new, .t-add { color: var(--green); } .t-changed, .t-modified, .t-change { color: var(--cyan); } .t-removed, .t-delete { color: var(--rose); }
  .t-fix { color: var(--amber); } .t-refactor { color: var(--violet); } .t-docs, .t-chore { color: var(--slate); } .t-risk { color: var(--orange); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 500 12px var(--mono); color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--cyan); }

  .files { padding: 6px 0; overflow: hidden; }
  .files .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 8px; font: 600 12px var(--mono); color: var(--muted); }
  .area { border-top: 1px solid var(--border); }
  .area > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 16px; font: 600 12.5px var(--mono); color: var(--text); }
  .area > summary::-webkit-details-marker { display: none; }
  .area > summary::before { content: "▸"; color: var(--dim); transition: transform .15s; }
  .area[open] > summary::before { transform: rotate(90deg); }
  .area > summary .n { margin-left: auto; font-weight: 500; }
  .frow { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 5px 16px 5px 30px; font: 12.5px var(--mono); cursor: default; }
  .frow.link { cursor: pointer; } .frow.link:hover, .frow.hl { background: var(--panel-2); }
  .frow .st { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
  .st.A { color: var(--green); } .st.M { color: var(--amber); } .st.D { color: var(--rose); } .st.R { color: var(--violet); }
  .frow .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .frow .p bdi { direction: ltr; } .frow .p .dir { color: var(--dim); }
  .frow .ad { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .plus { color: var(--green); } .minus { color: var(--rose); }
  .blocks { display: inline-flex; gap: 2px; } .blocks i { width: 7px; height: 7px; border-radius: 2px; background: var(--border-2); }
  .blocks i.g { background: var(--green); } .blocks i.r { background: var(--rose); }
  .fnote { grid-column: 2 / 4; color: var(--muted); font: 12.5px/1.45 var(--sans); margin-top: -2px; }

  /* diagrams */
  figure.dia { margin: 0 0 18px; padding: 18px 18px 14px; overflow: hidden; }
  @media (min-width: 1300px) { #diagram { position: relative; left: 50%; transform: translateX(-50%); width: min(1640px, calc(100vw - 64px)); } }
  figure.dia figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 18px; margin-bottom: 10px; }
  figure.dia .ft { font-weight: 600; font-size: 16px; }
  figure.dia .fc { color: var(--muted); font-size: 14px; margin-top: 10px; }
  .canvas { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--border); background-color: var(--bg-2); touch-action: none; cursor: grab; outline: none;
    background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px), linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); }
  .canvas:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
  .canvas.grabbing, .stage.grabbing { cursor: grabbing; }
  .canvas svg { display: block; position: absolute; inset: 0; }
  .canvas.full { position: fixed; inset: 12px; z-index: 60; border-radius: 14px; box-shadow: var(--shadow); height: auto !important; }
  body.noscroll { overflow: hidden; }
  .cam-hint { position: absolute; left: 10px; bottom: 8px; font: 500 11px var(--mono); color: var(--dim); pointer-events: none; opacity: 0; transition: opacity .2s; }
  .canvas:hover .cam-hint { opacity: 1; }
  .ctl { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 11px; background: var(--chrome); border: 1px solid var(--border-2); box-shadow: var(--shadow); backdrop-filter: blur(10px); z-index: 4; }
  .ctl button { min-width: 30px; height: 28px; border: 0; background: none; color: var(--text); font: 600 13px var(--mono); border-radius: 8px; cursor: pointer; padding: 0 7px; }
  .ctl button:hover:not(:disabled) { background: var(--panel-2); color: var(--cyan); }
  .ctl button:disabled { opacity: .35; cursor: default; }
  .ctl .pct { min-width: 54px; font-weight: 500; color: var(--muted); }
  .ctl .sep { width: 1px; height: 18px; background: var(--border-2); margin: 0 3px; }
  .ctl .depth { font: 700 10px var(--mono); letter-spacing: .12em; color: var(--dim); padding: 0 8px; }
  .mini-ctl { opacity: .0; transition: opacity .2s; } .canvas:hover .mini-ctl, .canvas:focus-within .mini-ctl, .canvas.full .mini-ctl { opacity: 1; }
  @media (hover: none) { .mini-ctl { opacity: 1; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 11px var(--mono); color: var(--muted); align-items: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 6px; vertical-align: -1px; }
  svg .n-mask { fill: var(--mask); }
  svg .n-body { stroke-width: 1.5; transition: stroke-width .15s, filter .15s; }
  svg .n-label { fill: var(--text); font: 600 13px var(--mono); letter-spacing: -.01em; }
  svg .n-sub { fill: var(--muted); font: 10px var(--mono); }
  svg .e-label { fill: var(--muted); font: 600 10px var(--mono); }
  svg .e-lbg { fill: var(--bg-2); stroke: var(--border); }
  svg .g-label { font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  svg .badge-tx { font: 700 8.5px var(--mono); letter-spacing: .08em; }
  svg .edge { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke-width .15s, opacity .2s; }
  svg .halo { fill: none; stroke: var(--bg-2); stroke-width: 6; }
  svg .hitline { fill: none; stroke: transparent; stroke-width: 12; }
  svg .flowline { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 10 70; opacity: 0; pointer-events: none; }
  .flowing svg .flowline { opacity: .9; animation: flowdash 2.4s linear infinite; }
  .flowing svg .edge { opacity: .8; }
  @keyframes flowdash { to { stroke-dashoffset: -160; } }
  /* intake badges and the view tour: a ticket dot rides the loop while flow is on */
  svg .intake-chip { fill: #fff; stroke: var(--border-2); stroke-width: 1.2; }
  svg .intake-tx { fill: var(--muted); font: 600 10.5px var(--sans); }
  svg .intake-chip.dashed { fill: var(--panel); stroke: var(--w-feeds); stroke-dasharray: 3 3; }
  svg .intake-mark { fill: #1b1f23; font: 700 13px var(--sans); }
  svg .intake-chip.dashed + .intake-mark { fill: var(--w-feeds); }
  svg .tour, svg .tour-glow { display: none; pointer-events: none; }
  .flowing svg .tour, .flowing svg .tour-glow { display: inline; }
  svg .tour-glow { fill: none; stroke-width: 7; stroke-linecap: round; filter: blur(2.5px); }
  svg .tour-dot { fill: var(--w-feeds); stroke: var(--bg-2); stroke-width: 1.5; filter: drop-shadow(0 0 6px var(--w-feeds)); }
  svg .tour-packet { fill: var(--w-feeds); }
  .flowing svg .node.tour-stop { transform-box: fill-box; transform-origin: center; animation: tour-pulse 8s ease-in-out infinite; }
  @keyframes tour-pulse { 0%, 9%, 100% { transform: none; filter: none; } 4% { transform: scale(1.04); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--w-feeds) 60%, transparent)); } }
  .flowing svg .edge-g.back .edge { animation: march 1.1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -22; } }
  @media (prefers-reduced-motion: reduce) { svg .tour, svg .tour-glow { display: none !important; } .flowing svg .node.tour-stop, .flowing svg .edge-g.back .edge { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .flowing svg .flowline { animation: none; opacity: 0; } .flowing svg .edge { opacity: 1; } }
  .ctl button.on { color: var(--cyan); background: var(--cyan-f); }
  svg .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { svg .flow { animation: none; } }
  /* reading depths (archify): far out = shapes + names; closer = subs, verbs, edge labels */
  .depth-read { transition: opacity .18s; }
  [data-depth="map"] .depth-read { opacity: 0; pointer-events: none; }
  /* typed node styles (map) */
  svg .node { cursor: pointer; outline: none; }
  svg .node .n-ring { fill: none; stroke-width: 1.2; stroke-opacity: .38; }
  svg .node.pub .n-body { stroke-width: 2.6; }

  svg .node.priv .n-body { stroke-width: 1; stroke-opacity: .7; fill-opacity: .5; }

  svg .node.priv .n-sub { display: none; }
  svg .node.priv .n-sigil { opacity: .7; }

  svg .node .ini-tx { font: 700 7.5px var(--mono); }
  svg .node .tab-tx { font: 800 8px var(--mono); letter-spacing: .14em; fill: var(--mask); }

  svg .node .verb-tx { font: 600 9.5px var(--mono); }

  svg .edge-g.hov .edge, svg .edge-g.hot .edge { stroke-width: 2.6; }
  .focusing svg .node:not(.sel):not(.nb) { opacity: .28; }
  .focusing svg .edge-g:not(.hot) { opacity: .15; }
  .focusing svg .e-lab:not(.hot) { opacity: .15; }
  svg .node, svg .edge-g, svg .e-lab { transition: opacity .2s; }
  svg .node.sel .n-body { stroke-width: 3.2; }

  .detail-bullets { margin: 0; padding-left: 18px; max-width: 1100px; font-size: 13px; line-height: 1.65; }
  .detail-bullets li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 2px; }
  .detail-bullets li::before { content: '•'; margin-right: 8px; color: var(--accent); }
  .links ul { margin: 0; padding: 0; list-style: none; }
  .links li { margin: 0; }
  .morebtn { border: 0; background: none; color: var(--accent); font: 600 12px var(--sans); padding: 2px 0 0; cursor: pointer; }
  .pnone { color: var(--dim); font-size: 13px; }
  .pverbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pverb { font: 600 12px var(--sans); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 8%, transparent); padding: 1px 9px; border-radius: 999px; }
  button.pverb { cursor: pointer; } button.pverb:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
  .links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 22px; }
  .src { display: flex; align-items: center; gap: 6px; min-width: 0; } .src a, .src span { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .rel { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; text-align: left; background: none; border: 0; padding: 4px 6px; margin: 0 -6px; width: calc(100% + 12px); border-radius: 6px; cursor: pointer; color: var(--text); font: 13px var(--sans); }
  .rel:hover { background: var(--panel-2); }
  .rel i { width: 8px; height: 8px; border-radius: 50%; }
  .rel-l { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rel-e { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .rel-none { color: var(--dim); font-size: 12.5px; padding: 2px 0; }
  .pviews { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pview { font: 500 12px var(--sans); color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .pview:hover { color: var(--text); border-color: var(--accent); }

  /* phone: still a map; the header folds to one line and details slide up from the bottom */
  @media (max-width: 820px) {
    .mapapp, body.tree-open .mapapp { grid-template-columns: 0 minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr); }
    .mbar { gap: 8px; padding: 0 10px; }
    .crumbs, #m-export, .menu, #m-help, .findbtn .ft, .findbtn .kbd { display: none; }
    .findbtn { width: 32px; padding: 0; justify-content: center; }
    .mbrand { flex: 1; } .mbrand span { overflow: hidden; text-overflow: ellipsis; }
    .outline { position: fixed; top: 48px; bottom: 0; left: 0; width: min(320px, 88vw); z-index: 20; box-shadow: var(--shadow); }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; height: auto; max-height: 58dvh; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.15); }
    .panel::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--border-2); margin: 8px auto 0; }
    .ph { padding-top: 6px; } .ph .obtn span { display: none; }
    .links { grid-template-columns: 1fr; }
    .minimap, .m-legend, .hint { display: none; }
    .mctl { bottom: 14px; right: 12px; }
    .vpop ol { columns: 1; }
  }

  /* endpoints */
  .eps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  @media (max-width: 420px) { .eps { grid-template-columns: 1fr; } }
  .ep { padding: 14px 16px; }
  .ep .line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .method { font: 700 11px var(--mono); padding: 3px 8px; border-radius: 6px; letter-spacing: .06em; border: 1px solid currentColor; }
  .m-GET { color: var(--green); background: var(--green-f); } .m-POST { color: var(--cyan); background: var(--cyan-f); }
  .m-PUT, .m-PATCH { color: var(--amber); background: var(--amber-f); } .m-DELETE { color: var(--rose); background: var(--rose-f); }
  .m-WS, .m-SSE, .m-CLI, .m-CMD, .m-EVENT { color: var(--violet); background: var(--violet-f); }
  .ep .path { font: 600 14px var(--mono); word-break: break-all; }
  .ep .desc { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .ep details { margin-top: 8px; } .ep summary { cursor: pointer; color: var(--muted); font: 600 12px var(--mono); }
  pre.json { margin: 6px 0 0; padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; font: 12px/1.5 var(--mono); overflow-x: auto; }

  /* steps */
  .steps { counter-reset: s; display: grid; gap: 0; }
  .step { display: grid; grid-template-columns: 40px 1fr; gap: 14px; position: relative; padding-bottom: 18px; }
  .step::before { content: ""; position: absolute; left: 19px; top: 38px; bottom: 0; width: 2px; background: var(--border); }
  .step:last-child::before { display: none; }
  .step .dot { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 700 14px var(--mono); color: var(--cyan); background: var(--cyan-f); border: 1px solid var(--cyan); }
  .step .body { padding: 14px 18px; }
  .step h3 { margin: 0 0 4px; font-size: 16px; } .step .detail { color: var(--muted); font-size: 14.5px; }

  /* hunks */
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 8px 0; border-bottom: 1px solid var(--border); scrollbar-width: thin; }
  .tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--muted); font: 600 12.5px var(--mono); padding: 8px 12px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel-2); border-color: var(--border); margin-bottom: -1px; }
  .hpanel { display: none; } .hpanel.on { display: block; }
  .hhead { padding: 14px 18px 10px; } .hhead .fn { font: 600 13px var(--mono); color: var(--muted); } .hhead .hs { margin-top: 4px; font-size: 15px; }
  .hbody { display: grid; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1000px) { .hbody.has-notes { grid-template-columns: minmax(0, 1fr) 300px; } }
  .diff { overflow-x: auto; border-top: 1px solid var(--border); background: var(--bg-2); }
  .diff table { border-collapse: collapse; width: 100%; font: 12.5px/1.55 var(--mono); }
  .diff td { padding: 0 10px; white-space: pre; vertical-align: top; }
  .diff td.ln { color: var(--dim); text-align: right; user-select: none; width: 1%; padding: 0 8px; }
  .diff td.sg { width: 1%; user-select: none; padding: 0 4px; color: var(--dim); }
  .diff td.mk { width: 1%; padding: 0 4px; }
  .diff tr.add { background: var(--add-bg); } .diff tr.add td.code, .diff tr.add td.sg { color: var(--add-tx); }
  .diff tr.del { background: var(--del-bg); } .diff tr.del td.code, .diff tr.del td.sg { color: var(--del-tx); }
  .diff tr.hdr td { color: var(--violet); background: var(--panel-2); padding: 3px 10px; }
  .diff.newfile tr.add { background: none; } .diff.newfile tr.add td.code { color: var(--text); } .diff.newfile td.sg, .diff.newfile td.ln.o { display: none; }
  .diff tr.noted td.code { box-shadow: inset 2px 0 0 var(--amber); }
  .pin { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--amber); color: #111; font: 700 10px var(--mono); }
  .notes { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 10px; align-content: start; }
  @media (min-width: 1000px) { .notes { border-left: 1px solid var(--border); } }
  .note { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; color: var(--muted); }
  .note b { color: var(--text); font-weight: 600; }
  .more { padding: 8px 18px; color: var(--dim); font: 12px var(--mono); border-top: 1px solid var(--border); }

  /* risks / tests / questions */
  .two { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .list { padding: 6px 0; }
  .li { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--border); align-items: start; font-size: 14.5px; }
  .li:first-child { border-top: none; }
  .lvl { font: 700 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; margin-top: 2px; }
  .lvl.high { color: var(--rose); } .lvl.med, .lvl.medium { color: var(--amber); } .lvl.low { color: var(--green); }
  .li input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--green); }
  .li .cmd { display: block; margin-top: 4px; color: var(--muted); }
  .q { padding: 14px 18px; border-top: 1px solid var(--border); } .q:first-child { border-top: none; }
  .q .qq { font-weight: 600; } .q .qd { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .q .qd b { color: var(--green); font-weight: 600; }
  footer { padding: 34px 0 44px; color: var(--dim); font: 12px var(--mono); }
  .empty { color: var(--dim); padding: 14px 18px; }
</style>

nt and starts the spec.", "when": "You have read intent.md and answered its open questions.", "how": "Rewrites the intent with your answers, creates the branch and worktree, then spawns the spec-writer.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md", "sublabel": "<job-id>"}, {"id": "cmd-approve-spec", "label": "/factory approve-spec", "kind": "public", "what": "Approves the spec and starts planning.", "when": "You have read spec.md and its Risk and Assumptions.", "how": "Writes your words and the time to spec-approval.md. A spec with a Split section goes to the split step instead of the planner.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md", "sublabel": "<job-id>"}, {"id": "cmd-respec", "label": "/factory respec", "kind": "public", "what": "Sends the spec back with a note.", "when": "The spec is not right yet.", "how": "Saves your note verbatim as spec-feedback-N.md and re-spawns the spec-writer.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md", "sublabel": "<job-id> <note>"}, {"id": "cmd-approve", "label": "/factory approve", "kind": "public", "what": "Merges a needs-human job.", "when": "The approver escalated and you decided it is fine.", "how": "Writes human-approval.md and runs the merge gate with the human-approved flag. Never used without this command.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md", "sublabel": "<job-id>"}, {"id": "cmd-rework", "label": "/factory rework", "kind": "public", "what": "Sends a needs-human job back to the builder.", "when": "You want a change before it merges.", "how": "Saves your note as rework-N.md and starts a fresh builder with a fresh resume budget.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md", "sublabel": "<job-id> <note>"}, {"id": "cmd-ready", "label": "/factory ready", "kind": "public", "what": "Starts split children whose dependencies have merged.", "when": "A split parent exists, or a child just merged.", "how": "Runs jobctl ready --close-parents, creates a worktree and spec for each ready child, and closes a parent whose children all merged.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md"}, {"id": "cmd-next", "label": "/factory next", "kind": "public", "what": "Runs the first unchecked backlog item.", "when": "You want the next queued job.", "how": "Claims the line in factory/backlog.md with one edit so two sessions never take the same item.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md"}, {"id": "cmd-stop", "label": "/factory stop | resume", "kind": "public", "what": "Pauses unfinished jobs and picks them up again.", "when": "You are stopping work, or a session limit cut a run off.", "how": "Pause stops the next stage from starting; a subagent already running can only be stopped by interrupting the session. Resume continues from the job files.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md"}, {"id": "cmd-metrics", "label": "/factory metrics", "kind": "public", "what": "Cycle time, first-pass rate, review rounds, escalation rate.", "when": "You want to see how the factory is doing.", "how": "Runs metrics.py over the job.json files; nothing is stored separately.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/metrics.py"}, {"id": "cmd-lessons", "label": "/factory lessons", "kind": "public", "what": "Groups review findings that recur across jobs and suggests a fix for each.", "when": "You have several jobs of history.", "how": "Reads every CHANGES review, groups near-identical findings seen in at least two jobs, and suggests architecture, types, lint, test or rule, strongest first. You decide; nothing is changed for you.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/lessons.py"}, {"id": "cmd-doctor", "label": "/factory doctor", "kind": "public", "what": "Checks that a repo is ready for the factory.", "when": "Before the first job, and after any setup change.", "how": "Checks AGENTS.md covers setup, tests, build, dev server, layout, conventions and what not to touch, and that policy, hooks, gitignore, helper skills and verify-app are in place.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/doctor.py"}, {"id": "cmd-init", "label": "/factory init", "kind": "public", "what": "Drafts AGENTS.md (and VERIFY.proposed.md for an app) for a new repo.", "when": "The repo has no project doc yet.", "how": "Spawns the onboarder. If AGENTS.md exists it writes AGENTS.proposed.md instead; you merge it.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md"}, {"id": "cmd-review", "label": "/factory review", "kind": "public", "what": "Reviews any branch or pull request.", "when": "You want a second opinion outside a factory job.", "how": "Runs review_branch.py; a read-only agent reviews against REVIEW.md and a script drops comments not on a real diff line. Nothing is posted.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/review_branch.py", "sublabel": "<branch | --pr N>"}, {"id": "cmd-maintain", "label": "/factory maintain", "kind": "public", "what": "Runs the maintain loop: collect, run, scan, triage, schedule.", "when": "You want to watch the product, not just build features.", "how": "Detection is plain statistics; the model only diagnoses and writes. A serious breach becomes an intent that waits for you.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md"}, {"id": "install", "label": "Install", "kind": "lane", "what": "How to put Forgeline in a repository.", "when": "Once per repo.", "how": "Copy .claude/ and factory/, ignore the runtime files, run doctor, set your verify commands, and run the evals.", "sublabel": "copy, doctor, policy", "opensView": "install"}, {"id": "agents", "label": "All 14 agents", "kind": "lane", "what": "Who writes what.", "when": "Whenever you want to know which agent owns a file.", "how": "Nine agents run the job loop; five sit beside it. Each writes exactly one file and never merges, pushes or deploys.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents", "sublabel": "who writes what", "opensView": "agents"}, {"id": "guardrails", "label": "Guardrails", "kind": "lane", "what": "What stops an agent.", "when": "Always on.", "how": "Hooks, the policy file, the weakened-bar scan, secrets checks, the audit trail and the merge gate.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/policy.json", "sublabel": "hooks, policy, scans", "opensView": "guardrails"}, {"id": "split", "label": "Split jobs", "kind": "lane", "what": "Big work becomes dependent child jobs.", "when": "The spec-writer adds a Split section.", "how": "Children inherit the accepted intent, wait on their dependencies, and are specced only after those have merged.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/jobctl.py", "sublabel": "big work → child jobs", "opensView": "split"}, {"id": "parallel", "label": "Parallel + worktrees", "kind": "lane", "what": "One session per job.", "when": "You run several jobs at once.", "how": "Each job has its own branch, worktree, ports and browser session, so jobs never touch each other.", "sublabel": "one session per job", "opensView": "parallel"}, {"id": "maintain", "label": "Maintain loop", "kind": "lane", "what": "Watches the running product and the repo.", "when": "On a schedule, or when you run /factory maintain.", "how": "Collects metrics, detects breaches, diagnoses read-only, and scans four lenses. It never merges, deploys or pushes.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain", "sublabel": "watch, diagnose, scan", "opensView": "maintain"}, {"id": "dashboard", "label": "Dashboard + metrics", "kind": "lane", "what": "A live board over factory/jobs.", "when": "While jobs run.", "how": "dashboard.html polls every two seconds; metrics and lessons read the same job files.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/dashboard.html", "sublabel": "live board, cycle time", "opensView": "dashboard"}, {"id": "evals", "label": "Evals + CI", "kind": "lane", "what": "Proof that the factory itself still works.", "when": "After any change to .claude/ or factory/.", "how": "326 offline checks with no model, 17 live agent cases on fixture repos, and a CI workflow.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/evals", "sublabel": "326 offline, 17 live", "opensView": "evals"}, {"id": "intent-writer", "label": "intent-writer", "kind": "lane", "what": "Writes intent.md in the originator's own words.", "when": "At /factory intent.", "how": "Quotes your words verbatim, marks guesses, lists open questions with suggested defaults, and never designs the solution. Model: sonnet.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/intent-writer.md", "sublabel": "sonnet · intent.md"}, {"id": "spec-writer", "label": "spec-writer", "kind": "lane", "what": "Writes spec.md: risk, design, criteria, and a Split when needed.", "when": "After the intent is accepted.", "how": "Reads AGENTS.md, the code, the intent, out-of-scope.md, the glossary and ADRs. Rates Risk high for CI, deploy, money or access. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/spec-writer.md", "sublabel": "opus · spec.md"}, {"id": "planner", "label": "planner", "kind": "lane", "what": "Writes plan.md. Never edits code.", "when": "After the spec is approved.", "how": "Cites real source and pinned versions for any API it relies on, labels each safety claim by how far it was checked, and writes PLAN: BLOCKED if the spec needs a frozen path. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/planner.md", "sublabel": "opus · plan.md"}, {"id": "builder", "label": "builder", "kind": "lane", "what": "Implements the plan and writes build.md.", "when": "After PLAN: READY, and again after each CHANGES round.", "how": "Named builder-<job-id> so it can be resumed. Works only in the worktree, runs tdd, uses verify-app for UI, ticks the Definition of Done. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/builder.md", "sublabel": "opus · build.md + commits"}, {"id": "reviewer-security", "label": "reviewer-security", "kind": "lane", "what": "Security lens.", "when": "Every review round.", "how": "Applies factory/checklists/security.md to the diff: access control, input handling, data exposure, secrets, dependencies, workflow files. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/reviewer-security.md", "sublabel": "opus · review file"}, {"id": "reviewer-ux", "label": "reviewer-ux", "kind": "lane", "what": "Experience lens.", "when": "Every review round.", "how": "Applies the accessibility checklist (flow) and must open the page in agent-browser when the diff changes what it renders. Has the Skill tool for verify-app. Model: sonnet.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/reviewer-ux.md", "sublabel": "sonnet · review file"}, {"id": "reviewer-ui", "label": "reviewer-ui", "kind": "lane", "what": "Visual lens.", "when": "Every review round.", "how": "Checks tokens, spacing, contrast and responsive behaviour against the repo's own styles, and opens the page. Model: sonnet.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/reviewer-ui.md", "sublabel": "sonnet · review file"}, {"id": "reviewer-code", "label": "reviewer-code", "kind": "lane", "what": "Correctness lens.", "when": "Every review round.", "how": "Checks the diff against the spec and plan, the weakened bar, the Definition of Done ticks, and the performance, observability and testing checklists. Model: sonnet.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/reviewer-code.md", "sublabel": "sonnet · review file"}, {"id": "approver", "label": "approver", "kind": "lane", "what": "The final gate: APPROVE or ESCALATE.", "when": "After all four reviews PASS.", "how": "Re-runs a command from build.md, checks the one claim most likely wrong, runs policy_check.py, and ends decision.md with Door, Blast radius and Evidence. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/approver.md", "sublabel": "opus · decision.md"}, {"id": "onboarder", "label": "onboarder", "kind": "lane", "what": "Drafts AGENTS.md for an unfamiliar repo.", "when": "At /factory init.", "how": "Reads manifests and config and runs only read commands. Writes UNKNOWN: ask the owner for anything it cannot find. For an app it also drafts VERIFY.proposed.md. Model: sonnet.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/onboarder.md", "sublabel": "sonnet · AGENTS.md"}, {"id": "pr-reviewer", "label": "pr-reviewer", "kind": "lane", "what": "Reviews any branch or pull request.", "when": "At /factory review.", "how": "Read-only. A script drops any comment whose file, line or quoted code is not in the diff, so an invented comment cannot reach a PR. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/pr-reviewer.md", "sublabel": "opus · review.json"}, {"id": "diagnoser", "label": "diagnoser", "kind": "lane", "what": "Explains a metric breach, read-only.", "when": "A metric leaves its band.", "how": "Checks that the metric measures what the band assumes, then lists competing hypotheses and the evidence that separates them. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/diagnoser.md", "sublabel": "opus · diagnosis.md"}, {"id": "scanner-security", "label": "scanner-security", "kind": "lane", "what": "Security scan lens.", "when": "At /factory maintain scan.", "how": "Tries to disprove each candidate; a script then checks every finding against a real file, line and quoted text. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/scanner-security.md", "sublabel": "opus · findings.json"}, {"id": "scanner-quality", "label": "scanner-quality", "kind": "lane", "what": "Maintainability scan lens.", "when": "At /factory maintain scan.", "how": "Looks for swallowed errors, dead code, duplicated logic and untested risky code. Model: opus.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/scanner-quality.md", "sublabel": "opus · findings.json"}, {"id": "tdd", "label": "tdd", "kind": "external", "what": "Red-green-refactor, one vertical slice at a time.", "when": "Every build.", "how": "Pinned to one commit and installed by install_helper_skills.py. The builder must call it before its first edit when it is installed.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/skills/helper-skills.json", "author": "mattpocock", "origin": "mattpocock-skills", "external": true}, {"id": "diagnosing-bugs", "label": "diagnosing-bugs", "kind": "external", "what": "Reproduce, minimise, hypothesise, instrument, fix, regress.", "when": "A bugfix job.", "how": "Used by the builder for Type: bugfix to build the failing-test feedback loop.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/skills/helper-skills.json", "author": "mattpocock", "origin": "mattpocock-skills", "external": true}, {"id": "codebase-design", "label": "codebase-design", "kind": "external", "what": "Deep modules with small interfaces.", "when": "The plan's interface or module shape is unclear.", "how": "Vocabulary for the planner and builder: module, interface, depth, seam.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/skills/helper-skills.json", "author": "mattpocock", "origin": "mattpocock-skills", "external": true}, {"id": "code-review", "label": "code-review", "kind": "external", "what": "Standards and Spec axes for a review.", "when": "reviewer-code and pr-reviewer.", "how": "Applied inside one review; no sub-agents.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/skills/helper-skills.json", "author": "mattpocock", "origin": "mattpocock-skills", "external": true}, {"id": "grilling", "label": "grilling", "kind": "external", "what": "Interview method for open questions.", "when": "At /factory accept with unanswered questions.", "how": "Used by the orchestrator, never inside a subagent: nobody is there to answer.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/skills/helper-skills.json", "author": "mattpocock", "origin": "mattpocock-skills", "external": true}, {"id": "agent-browser", "label": "agent-browser", "kind": "external", "what": "Browser automation CLI used with your installed Chrome.", "when": "The builder and the UX and UI reviewers look at a page.", "how": "Every call passes --session <job-id>-<role> so jobs never share a browser. Install it yourself; pin a version.", "author": "vercel-labs", "origin": "vercel-labs/agent-browser", "external": true}, {"id": "verify-app", "label": "verify-app", "kind": "board", "what": "Your repo's own account of how to start the app and what each area should show.", "when": "Builder and UI reviewers, when it is installed.", "how": "Drafted by the onboarder as VERIFY.proposed.md; a person reads it and installs it as .claude/skills/verify-app/SKILL.md. Doctor warns until it exists.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/templates/verify-app.md", "sublabel": "per-repo skill"}, {"id": "jobctl", "label": "jobctl.py", "kind": "script", "what": "The only writer of job state.", "when": "Every stage change.", "how": "create, set, bump, pause, resume, active, ready, show. Claims the next job number with a plain mkdir so two sessions never clash.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/jobctl.py", "sublabel": "job state"}, {"id": "snapshot-audit", "label": "snapshot_audit.py", "kind": "script", "what": "Commits the job folder to the job branch.", "when": "After each artifact.", "how": "Copies factory/jobs/<id>/ to factory/audit/<id>/ in the worktree and commits it, so the whole record merges with the change.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/snapshot_audit.py"}, {"id": "policy-check", "label": "policy_check.py", "kind": "script", "what": "Matches changed files against policy.json.", "when": "The approver and the merge gate.", "how": "Prints VIOLATION for a frozen path, ESCALATE-TRIGGER for escalate paths, dependency files, size and a weakened bar (suppressions, skipped or deleted tests, stripped assertions).", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/policy_check.py"}, {"id": "merge-gate", "label": "merge_gate.py", "kind": "script", "what": "The only route to main.", "when": "After APPROVE or /factory approve.", "how": "One lock, ordered checks, a throwaway trial merge, verify and ratchets, then the real merge. Exit codes 0 merged, 3 human, 4 refused, 5 verify failed, 6 lock held, 7 merge failed.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py", "opensView": "gate"}, {"id": "constraints-py", "label": "constraints.py", "kind": "script", "what": "Ratchets: a measured number must not fall.", "when": "Inside the merge gate.", "how": "Runs each merge_policy.constraints command on the merged result and compares with the baseline read from the base checkout, so a branch cannot lower it. Exceptions need an owner and an expiry within a year.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/constraints.py"}, {"id": "adr-py", "label": "adr.py", "kind": "script", "what": "Records a merged Design section as an ADR.", "when": "After a merge.", "how": "Commits docs/adr/NNNN-slug.md when the spec has a real Design section. Turn it off with policy.adr.dir set to an empty string.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/adr.py"}, {"id": "doctor-py", "label": "doctor.py", "kind": "script", "what": "Readiness checks.", "when": "/factory doctor.", "how": "PASS, WARN or FAIL per check; exit 1 on any FAIL.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/doctor.py"}, {"id": "lessons-py", "label": "lessons.py", "kind": "script", "what": "Groups repeated review findings.", "when": "/factory lessons.", "how": "Word-overlap grouping across CHANGES reviews in jobs and audit copies; suggestions come from a small hint table. Read the groups yourself.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/lessons.py"}, {"id": "metrics-py", "label": "metrics.py", "kind": "script", "what": "Cycle time and rates.", "when": "/factory metrics.", "how": "Computed from job.json history; nothing else is stored.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/metrics.py"}, {"id": "review-branch", "label": "review_branch.py", "kind": "script", "what": "Reviews any branch or PR.", "when": "/factory review.", "how": "Runs the pr-reviewer, validates every comment against the diff, and writes gh-review.sh for you to run. It never posts.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/review_branch.py"}, {"id": "install-helpers", "label": "install_helper_skills.py", "kind": "script", "what": "Installs five pinned MIT skills.", "when": "At setup.", "how": "Clones at the commit pinned in helper-skills.json. Read the skills first: they become instructions your agents follow.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/install_helper_skills.py"}, {"id": "managed-install", "label": "managed/install.py", "kind": "script", "what": "Installs the hooks as managed settings.", "when": "An admin step.", "how": "Dry run by default, --apply to write. Makes the hooks impossible for a repo writer to disable.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/managed/install.py"}, {"id": "collect-py", "label": "collect.py", "kind": "script", "what": "Gathers real metric values.", "when": "On a schedule.", "how": "Collectors: a command that prints a number, an HTTP JSON endpoint, a log's error rate, git, or the factory's own cycle time.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain/collect.py"}, {"id": "detect-py", "label": "detect.py", "kind": "script", "what": "Tests each metric against its own baseline.", "when": "After collect.", "how": "1 sigma logs, 2 sigma diagnoses, 3 sigma acts. Plain statistics; no model.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain/detect.py"}, {"id": "scan-py", "label": "scan.py", "kind": "script", "what": "Runs the four scan lenses.", "when": "Weekly, or /factory maintain scan.", "how": "Security and quality use agents; secrets and dependencies need no model. Every finding is verified against the repo and marked new, recurring or dismissed.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain/scan.py", "opensView": "scan-py"}, {"id": "dismiss-py", "label": "dismiss.py", "kind": "script", "what": "Dismisses a breach with a reason.", "when": "A metric cries wolf.", "how": "Needs a reason and widens that metric's band.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain/dismiss.py"}, {"id": "schedule-py", "label": "schedule.py", "kind": "script", "what": "Prints or installs the cron block.", "when": "Once, at setup.", "how": "Runs collect and run hourly, scans weekly and the evals weekly. Tested against a crontab file, not installed.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain/schedule.py"}, {"id": "run-evals", "label": "run_evals.py", "kind": "script", "what": "326 offline checks, no model.", "when": "After every change.", "how": "Covers config, hooks, managed settings, maintain, scan, the merge gate, scripts and artifact formats. Needs Python 3.12 or newer.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/evals/run_evals.py"}, {"id": "agent-evals", "label": "agent_evals.py", "kind": "script", "what": "17 live agent cases.", "when": "After a prompt change.", "how": "Runs each agent on a fixture repo and checks its output file. About 15 minutes of subscription use; one failure can be a flake, so re-run it once.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/evals/agent_evals.py"}, {"id": "ci-workflow", "label": "factory-evals.yml", "kind": "script", "what": "Runs the offline evals in CI.", "when": "On any change to .claude/, factory/, AGENTS.md or CLAUDE.md.", "how": "A GitHub Actions workflow on Python 3.12.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.github/workflows/factory-evals.yml"}, {"id": "hook-edits", "label": "Hook: edits", "kind": "hook", "what": "Refuses edits to frozen paths and to tests during a bug fix.", "when": "Every Edit or Write inside a factory worktree.", "how": "Reads factory/policy.json. Path rules apply only inside worktrees, so you are never blocked in your own checkout.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/hooks/factory_hooks.py", "sublabel": "frozen paths, test lock"}, {"id": "hook-bash", "label": "Hook: commands", "kind": "hook", "what": "Blocks push, deploy, publish, secrets in a commit, and a hand-merge of a factory branch.", "when": "Every Bash call.", "how": "Read-only git merge-tree and merge-base are allowed. A person authorises a release by starting Claude Code with FACTORY_RELEASE_AUTHORIZED=1; an inline prefix does not count.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/hooks/factory_hooks.py", "sublabel": "push, deploy, secrets"}, {"id": "weakened-bar", "label": "Weakened-bar scan", "kind": "hook", "what": "Flags a quietly lowered quality bar.", "when": "Every diff the approver or gate checks.", "how": "Added @ts-ignore, eslint-disable, noqa, skipped or deleted tests, stripped assertions. Each is an ESCALATE-TRIGGER, not a failure, so a person decides.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/policy_check.py"}, {"id": "secrets-scan", "label": "Secrets in commits", "kind": "hook", "what": "Blocks committing secrets.", "when": "Every commit command.", "how": "The bash hook scans staged content for common key formats. It complements a real scanner.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/hooks/factory_hooks.py"}, {"id": "escalate-triggers", "label": "Escalate triggers", "kind": "hook", "what": "What always sends a job to a person.", "when": "At the approver and the gate.", "how": "CI or deploy config, schema migrations, new dependencies, money, access or identity, a change over the size cap, a waived intent, a weakened bar, a high-risk spec.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/policy.json"}, {"id": "test-lock", "label": "Test lock (bugfix)", "kind": "hook", "what": "Tests are frozen after the failing-test commit.", "when": "Type: bugfix.", "how": "The builder commits a failing test, touches .factory-test-lock, and a hook then refuses test edits, so the code is fixed, never the test.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/hooks/factory_hooks.py"}, {"id": "release-var", "label": "Release variable", "kind": "hook", "what": "Only a person can authorise a push or deploy.", "when": "You start Claude Code yourself.", "how": "FACTORY_RELEASE_AUTHORIZED=1 must be in the environment of the session you start; an agent cannot set it for the hook.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/policy.json"}, {"id": "intent-inherit", "label": "Inherited intent", "kind": "hook", "what": "Split children carry the parent's accepted intent.", "when": "A child is created.", "how": "No waiver is recorded, so the approver does not auto-escalate a child.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/jobctl.py"}, {"id": "dep-check", "label": "Dependency check", "kind": "hook", "what": "A child whose dependency has not merged is refused.", "when": "Inside the merge gate.", "how": "Reads depends_on from job.json and each dependency's stage.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "merge-lock", "label": "Merge lock", "kind": "hook", "what": "One merge at a time.", "when": "Inside the merge gate.", "how": "A second gate run exits 6; you run it again. Stale after merge_policy.lock_stale_minutes.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "check-clean", "label": "Clean main", "kind": "hook", "what": "Main must be on the base branch with no stray changes.", "when": "First gate check.", "how": "A dirty tree (for example __pycache__ that is not ignored) is refused.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "check-decision", "label": "Decision present", "kind": "hook", "what": "APPROVE, or ESCALATE plus a human.", "when": "Second gate check.", "how": "ESCALATE merges only with the human-approved flag, passed only after /factory approve.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "check-pinned", "label": "Commit pinned", "kind": "hook", "what": "The approval is bound to a commit.", "when": "Third gate check.", "how": "job.reviewed_sha must equal the branch head, or every later commit must touch only the audit folder. A code commit after the review voids the approval.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "check-policy", "label": "Policy + intent", "kind": "hook", "what": "Frozen paths, escalate paths, size and intent.", "when": "Fourth gate check.", "how": "A frozen-path edit is always refused. Escalate paths, dependency files, size over the cap, or a waived intent need a human.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "trial-merge", "label": "Trial merge", "kind": "script", "what": "Merge into a throwaway copy of main as it is now.", "when": "After the checks pass.", "how": "Catches a branch that merges cleanly but no longer builds against a base that moved.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "verify-cmds", "label": "verify_commands", "kind": "script", "what": "Your build and tests, on the merged result.", "when": "Inside the trial merge.", "how": "Set merge_policy.verify_commands in policy.json. Empty prints NO VERIFY; require_verify refuses outright.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/policy.json"}, {"id": "real-merge", "label": "Real merge", "kind": "script", "what": "--no-ff merge, then cleanup.", "when": "After proof.", "how": "Removes the worktree and branch, sets stage merged, records an ADR. Never pushes.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/merge_gate.py"}, {"id": "intent-md", "label": "intent.md", "kind": "board", "what": "Your words, guesses marked, open questions.", "when": "Written by intent-writer.", "how": "First line INTENT: DRAFT; it is read as accepted once you accept it.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/templates/intent.md", "sublabel": "factory/jobs/<id>/"}, {"id": "spec-md", "label": "spec.md", "kind": "board", "what": "Risk, design, requirements, acceptance criteria, optional Split.", "when": "Written by spec-writer.", "how": "Each criterion is one observable behaviour plus how to verify it.", "sublabel": "factory/jobs/<id>/"}, {"id": "plan-md", "label": "plan.md", "kind": "board", "what": "Steps, proof, blast radius, rollback.", "when": "Written by planner.", "how": "First line PLAN: READY or PLAN: BLOCKED.", "sublabel": "factory/jobs/<id>/"}, {"id": "build-md", "label": "build.md", "kind": "board", "what": "Evidence for every criterion, the Definition of Done, plan adherence.", "when": "Written by builder.", "how": "First line STATUS: READY or BLOCKED. Rewritten each round with a Log.", "sublabel": "factory/jobs/<id>/"}, {"id": "review-files", "label": "review-*.md", "kind": "board", "what": "One verdict file per reviewer per round.", "when": "Written by each reviewer.", "how": "First line VERDICT: PASS or VERDICT: CHANGES. A review that exists only in a message does not count.", "sublabel": "round-N/"}, {"id": "decision-md", "label": "decision.md", "kind": "board", "what": "APPROVE or ESCALATE, with a merge-danger block.", "when": "Written by approver.", "how": "Door (one-way or two-way), Blast radius, Evidence.", "sublabel": "factory/jobs/<id>/"}, {"id": "job-json", "label": "job.json", "kind": "board", "what": "Stage, round, reviews, history, parent and dependencies.", "when": "Written only by jobctl.py.", "how": "The dashboard and metrics read it.", "sublabel": "factory/jobs/<id>/"}, {"id": "policy-json", "label": "policy.json", "kind": "board", "what": "The rules.", "when": "Read by hooks, policy_check and the gate.", "how": "frozen_paths, escalate_paths, dependency_files, test_globs, blocked_commands, ticketing, merge_policy, adr. Agents cannot edit it.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/policy.json"}, {"id": "dod", "label": "Definition of done", "kind": "board", "what": "A standing bar every job clears.", "when": "The builder ticks it; reviewers and approver check it.", "how": "Correctness, quality, integration, documentation, ship readiness. Frozen to agents.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/DEFINITION_OF_DONE.md"}, {"id": "review-md", "label": "REVIEW.md", "kind": "board", "what": "What counts as Important versus a Nit.", "when": "Every reviewer reads it.", "how": "Important blocks; a Nit goes under Notes, at most five.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/REVIEW.md"}, {"id": "checklists", "label": "checklists/", "kind": "board", "what": "Security, accessibility, performance, observability, testing.", "when": "Each reviewer applies the one for its pass.", "how": "Short lists; an item the diff does not touch is skipped without comment.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/checklists"}, {"id": "out-of-scope", "label": "out-of-scope.md", "kind": "board", "what": "Decisions already made not to build something.", "when": "intent-writer and spec-writer read it.", "how": "A person adds a line; agents may not.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/out-of-scope.md"}, {"id": "glossary", "label": "docs/GLOSSARY.md", "kind": "board", "what": "The project's terms.", "when": "intent-writer, spec-writer and planner read it.", "how": "Write one in your repo; it is not part of Forgeline."}, {"id": "adr-dir", "label": "docs/adr/", "kind": "board", "what": "Durable decisions.", "when": "Written by the merge gate after a merge.", "how": "A real Design section becomes NNNN-slug.md. The spec-writer and planner read them.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/adr.py"}, {"id": "constraints-json", "label": "constraints.json", "kind": "board", "what": "Ratchet baselines and exceptions.", "when": "Read by the merge gate from the base checkout.", "how": "A person raises a baseline; the gate only reports when a number improved.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/constraints.json"}, {"id": "worktree", "label": "git worktree", "kind": "board", "what": "One checkout per job.", "when": "Created at /factory accept.", "how": "<repo>-factory/<job-id> on branch factory/<job-id>. Agents change code only here."}, {"id": "audit-trail", "label": "Audit trail", "kind": "board", "what": "factory/audit/<job-id>/ on the branch.", "when": "After each stage.", "how": "Committed by snapshot_audit.py so the whole record merges with the change.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/snapshot_audit.py"}, {"id": "backlog", "label": "backlog.md", "kind": "board", "what": "Queue for /factory next.", "when": "Maintain triage accepts findings into it.", "how": "One unchecked line per item.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/backlog.md"}, {"id": "dashboard-html", "label": "dashboard.html", "kind": "board", "what": "The live board.", "when": "cd factory && python3 -m http.server.", "how": "Polls factory/jobs every two seconds. No build step.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/dashboard.html", "sublabel": "localhost:8000"}, {"id": "agents-md", "label": "AGENTS.md", "kind": "board", "what": "Your repo's own instructions.", "when": "Read by every agent first.", "how": "Setup, tests, build, lint, dev server and port, layout, conventions, what not to touch. The agents carry nothing repo-specific."}, {"id": "incident-md", "label": "incident.md", "kind": "board", "what": "A serious breach, written up.", "when": "A metric reaches 3 sigma.", "how": "Becomes an intent that waits for you.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain"}, {"id": "collectors-json", "label": "collectors.json", "kind": "board", "what": "Where metrics come from.", "when": "Edit it for your service.", "how": "Commands, HTTP endpoints, log files, git, the factory itself.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain/collectors.json"}, {"id": "findings", "label": "findings", "kind": "board", "what": "Scan results, each verified.", "when": "After a scan.", "how": "New, recurring or previously dismissed; sorted by severity.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/maintain"}, {"id": "triage", "label": "triage", "kind": "public", "what": "Accept a finding into the backlog, or dismiss it.", "when": "After a scan.", "how": "Dismiss needs a reason and the finding is not raised again.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/skills/factory/SKILL.md", "sublabel": "accept or dismiss"}, {"id": "session", "label": "Claude session", "kind": "public", "what": "One Claude Code session per job.", "when": "You open one per job.", "how": "A session orchestrates only the job it started.", "sublabel": "/factory <job>"}, {"id": "ports", "label": "Ports + sessions", "kind": "board", "what": "Builder 5100+10n, ux +1, ui +2.", "when": "Each job.", "how": "Each job and reviewer also gets its own agent-browser session."}, {"id": "slice", "label": "Slice (child job)", "kind": "lane", "what": "A full job: spec, build, reviews, approver, gate.", "when": "After its dependency merged.", "how": "Specced against the code as it then is, so it reads the real earlier work and the ADR.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/jobctl.py", "sublabel": "depends on the one before"}, {"id": "parent-close", "label": "Parent closes", "kind": "script", "what": "A split parent merges when every child has merged.", "when": "jobctl ready --close-parents.", "how": "The parent builds nothing; its worktree stays as the audit record.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/jobctl.py"}, {"id": "copy-step", "label": "Copy .claude/ + factory/", "kind": "public", "what": "Put the files in your repo.", "when": "First install step.", "how": "Start with an empty factory/jobs/ and an empty backlog.", "sublabel": "into the repo root"}, {"id": "gitignore", "label": ".gitignore.factory", "kind": "script", "what": "Lines to add to your .gitignore.", "when": "Install step 2.", "how": "/factory/jobs/, the test lock, __pycache__/. Without __pycache__ ignored the gate sees a dirty tree.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.gitignore.factory"}, {"id": "policy-edit", "label": "Edit policy.json", "kind": "board", "what": "Make the rules yours.", "when": "Install step 4.", "how": "escalate_paths, frozen_paths, test_globs and, above all, merge_policy.verify_commands.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/policy.json"}, {"id": "python312", "label": "Python 3.12+", "kind": "hook", "what": "Needed by the evals and maintain/scan.py.", "when": "Always.", "how": "The system Python 3.9 fails with a SyntaxError in scan.py. uv run --python 3.12 works."}, {"id": "audit-md", "label": "AUDIT.md", "kind": "board", "what": "What is proven and what is not.", "when": "Read it before trusting a part.", "how": "Evidence from the offline evals, the live evals and the end-to-end runs.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/AUDIT.md"}, {"id": "e2e", "label": "End-to-end runs", "kind": "board", "what": "Jobs run on a fixture repo.", "when": "After big changes.", "how": "Natural jobs, escalate with rework, a split job, UI jobs, and a CHANGES round on a fault-injected defect.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/AUDIT.md"}, {"id": "skip-intent", "label": "--skip-intent \"reason\"", "kind": "hook", "what": "The one waiver of the required intent.", "when": "You decide the feature is too small for an intent.", "how": "The reason is kept in job.json and the approver always escalates a waived intent. Never used on an agent's own judgment.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/scripts/jobctl.py", "sublabel": "only a person"}, {"id": "flag-ticket", "label": "--ticket KEY", "kind": "board", "what": "Links the job to a ticket.", "when": "Your prompt gives a ticket.", "how": "Every commit starts with the key. With policy.ticketing.mcp_server set, the ticket is read at the start and the outcome is commented at the end.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/factory/policy.json", "sublabel": "commit prefix"}, {"id": "flag-bugfix", "label": "--type bugfix", "kind": "board", "what": "Makes the builder reproduce the bug first.", "when": "The job fixes a bug.", "how": "The builder commits a failing test alone, then the test lock is created so the code is fixed, never the test.", "source": "https://github.com/Tarun-Aditya/Software-Factory/blob/main/.claude/agents/builder.md", "sublabel": "failing test first"}, {"id": "claim-line", "label": "Claim a backlog line", "kind": "script", "what": "Replaces the exact line with a checked, claimed one.", "when": "Every /factory next.", "how": "If the edit fails because the line changed, another session claimed it; the next unchecked item is tried.", "sour   function routeAudit(geo, where) {
    const issues = [];
    // routes: no crossings, no shared runs, no label lying across another route
    const segs = geo.edges.map(e => e.pts.slice(0, -1).map((a, i) => [a, e.pts[i + 1]]));
    const name = e => `${e.s.label}→${e.t.label}`;
    const crossing = ([a, b], [c, d]) => {
      const av = a[0] === b[0], cv = c[0] === d[0];
      if (av === cv) { // parallel: overlapping collinear run = shared trunk
        if (av && Math.abs(a[0] - c[0]) < 1) return Math.min(Math.max(a[1], b[1]), Math.max(c[1], d[1])) - Math.max(Math.min(a[1], b[1]), Math.min(c[1], d[1])) > 1 ? 'share' : null;
        if (!av && Math.abs(a[1] - c[1]) < 1) return Math.min(Math.max(a[0], b[0]), Math.max(c[0], d[0])) - Math.max(Math.min(a[0], b[0]), Math.min(c[0], d[0])) > 1 ? 'share' : null;
        return null;
      }
      const [v, hz] = av ? [[a, b], [c, d]] : [[c, d], [a, b]];
      const x = v[0][0], y = hz[0][1];
      const inV = y > Math.min(v[0][1], v[1][1]) + .5 && y < Math.max(v[0][1], v[1][1]) - .5, inH = x > Math.min(hz[0][0], hz[1][0]) + .5 && x < Math.max(hz[0][0], hz[1][0]) - .5;
      return inV && inH ? 'cross' : null;
    };
    for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
      if (geo.edges[i].fixed && geo.edges[j].fixed) continue; // one comb: its branches share the trunk by design
      let found = null;
      for (const s1 of segs[i]) { for (const s2 of segs[j]) { found = crossing(s1, s2); if (found) break; } if (found) break; }
      if (found === 'cross') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} cross`);
      if (found === 'share') issues.push(`${where}: edges ${name(geo.edges[i])} and ${name(geo.edges[j])} share a line`);
    }
    geo.edges.forEach((e, i) => { if (!e.lbl) return; const L = { x: e.lbl.x + 1, y: e.lbl.y + 1, w: e.lbl.w - 2, h: e.lbl.h - 2 };
      geo.edges.forEach((o, j) => { if (j !== i && segs[j].some(([a, b]) => Math.max(a[0], b[0]) > L.x && Math.min(a[0], b[0]) < L.x + L.w && Math.max(a[1], b[1]) > L.y && Math.min(a[1], b[1]) < L.y + L.h)) issues.push(`${where}: label "${e.lbl.text || e.lbl.step}" lies on edge ${name(o)}`); }); });
    const segHit = (r, i) => segs[i].some(([a, b]) => Math.max(a[0], b[0]) > r.x && Math.min(a[0], b[0]) < r.x + r.w && Math.max(a[1], b[1]) > r.y && Math.min(a[1], b[1]) < r.y + r.h);
    if (geo.map) {
      const ex = 12;
      geo.edges.forEach((e, i) => {
        // clearance: a route keeps 12+ px from every node it does not connect
        geo.nodes.forEach(n => { if (n.id === e.from || n.id === e.to) return;
          if (segHit({ x: n.x - ex + .5, y: n.y - ex + .5, w: n.w + 2 * ex - 1, h: n.h + 2 * ex - 1 }, i)) issues.push(`${where}: edge ${name(e)} passes within ${ex}px of node "${n.label}"`); });
        // no detours: a route stays under 2.5x the straight distance between its ends
        const len = e.pts.slice(1).reduce((a, p, k) => a + Math.abs(p[0] - e.pts[k][0]) + Math.abs(p[1] - e.pts[k][1]), 0);
        const d = Math.hypot(e.pts[e.pts.length - 1][0] - e.pts[0][0], e.pts[e.pts.length - 1][1] - e.pts[0][1]);
        if (len > 2.5 * Math.max(d, 100)) issues.push(`${where}: edge ${name(e)} takes a detour (${Math.round(len)}px for ${Math.round(d)}px)`);
        // reading order: every wire runs left to right, except one that closes a loop
        if (!e.back && !e.both && e.t.x + e.t.w / 2 <= e.s.x + e.s.w / 2) issues.push(`${where}: edge ${name(e)} runs right-to-left`);
      });
      if (geo.hub) { // hub views: one visible line into each callee
        const into = {}; geo.edges.forEach(e => { (into[e.to] ||= []).push(e); });
        Object.entries(into).forEach(([id, es]) => { es = es.filter(e => !e.back); if (es.some(e => e.from === geo.hub) && es.length > 1) issues.push(`${where}: hub callee "${(geo.byId[id] || {}).label || id}" has ${es.length} incoming lines`); });
      }
    }
    // author name tags hang under their card: no route may run through one
    (geo.nodes || []).forEach(n => { if (!n.tag) return; const r = { x: n.tag.x + 1, y: n.tag.y + 1, w: n.tag.w - 2, h: n.tag.h - 2 };
      geo.edges.forEach((o, j) => { if (segHit(r, j)) issues.push(`${where}: name tag "${n.tag.text}" lies on edge ${name(o)}`); }); });
    // lanes: every part sits inside its own lane, lanes never overlap, no route crosses a lane header
    const lanes = geo.lanes || [];
    lanes.forEach((l, i) => {
      lanes.slice(i + 1).forEach(m => { if (hit(l, m, -1)) issues.push(`${where}: lanes "${l.title}" and "${m.title}" overlap`); });
      (geo.nodes || []).forEach(n => {
        if (n.lane === i && (n.x < l.x || n.x + n.w > l.x + l.w || n.y < l.y || n.y + n.h + (n.tag ? 14 : 0) > l.y + l.h)) issues.push(`${where}: lane "${l.title}": node "${n.label}" sticks out`);
        if (n.lane != null && n.lane !== i && hit(n, l, -1)) issues.push(`${where}: lane "${l.title}": node "${n.label}" of another lane sits in it`);
        if (n.lane == null && hit(n, l, -1)) issues.push(`${where}: lane "${l.title}": node "${n.label}" belongs to no lane but sits in it`);
      });
    });
    (geo.blocks || []).forEach(b => geo.edges.forEach((o, j) => { if (segHit({ x: b.x + 1, y: b.y + 1, w: b.w - 2, h: b.h - 2 }, j)) issues.push(`${where}: lane "${b.title || ''}": header crossed by edge ${name(o)}`); }));
    const families = geo.families || [], inside = (a,b) => b.x > a.x && b.y > a.y && b.x+b.w < a.x+a.w && b.y+b.h < a.y+a.h;
    families.forEach(f => {
      const parent = families.find(p => p.id === f.parent);
      if (f.parent && (!parent || !inside(parent,f))) issues.push(`${where}: family "${f.label}" sticks out of its parent`);
      (f.nodeIds || []).forEach(id => { const n = geo.byId[id]; if (n && !inside(f,n)) issues.push(`${where}: family "${f.label}" does not contain "${n.label}"`); });
      families.filter(g => g !== f && g.parent === f.parent && g.id > f.id).forEach(g => { if (hit(f,g,-1)) issues.push(`${where}: families "${f.label}" and "${g.label}" overlap`); });
      geo.edges.forEach((e,i) => { if (segHit({x:f.x+8,y:f.y+3,w:Math.min(f.w-16,textW(f.label || f.id,11)+16),h:22},i)) issues.push(`${where}: family "${f.label}": header crossed by edge ${name(e)}`); });
    });
    return issues;
  }

  /* label-overlap audit used by `visual.py check` (world coordinates, real font metrics) */
  function auditSvg(svg, geo, where) {
    const issues = [], R = n => ({ x: n.x, y: n.y, w: n.w, h: n.h });
    const T = [...svg.querySelectorAll('text[data-t]')].map(t => { let b; try { b = t.getBBox(); } catch (_) { return null; } return { t: t.dataset.t, o: t.dataset.o, txt: t.textContent, b: { x: b.x, y: b.y, w: b.width, h: b.height } }; }).filter(x => x && x.b.w);
    const nodes = geo.nodes;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) if (hit(R(nodes[i]), R(nodes[j]), -1)) issues.push(`${where}: nodes "${nodes[i].label}" and "${nodes[j].label}" overlap`);
    T.forEach(a => {
      if (a.t === 'lt' || a.t === 'ft') {
        nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: lane "${a.txt}": header covers node "${n.label}"`); });
        if (a.t === 'ft') { const f = (geo.families || []).find(f => f.id === a.o); if (f && (a.b.x < f.x || a.b.x+a.b.w > f.x+f.w)) issues.push(`${where}: family title "${a.txt}" overflows its box`); }
      } else if (a.t === 'el') {
        nodes.forEach(n => { if (hit(a.b, R(n), -1)) issues.push(`${where}: edge label "${a.txt}" covers node "${n.label}"`); });
      } else {
        const own = geo.byId[a.o];
        if (own && (a.b.x < own.x + 1 || a.b.x + a.b.w > own.x + own.w - 1)) issues.push(`${where}: text "${a.txt}" overflows node "${own.label}"`);
        nodes.forEach(n => { if (n !== own && hit(a.b, R(n), -1)) issues.push(`${where}: text "${a.txt}" overlaps node "${n.label}"`); });
      }
    });
    issues.push(...routeAudit(geo, where));
    const els = T.filter(a => a.t === 'el');
    for (let i = 0; i < els.length; i++) for (let j = i + 1; j < els.length; j++) if (hit(els[i].b, els[j].b, -1)) issues.push(`${where}: edge labels "${els[i].txt}" and "${els[j].txt}" overlap`);
    return issues;
  }

  function toggleTheme() {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('visual-theme', next); } catch (e) {}
  }

  function renderDoc() {
  const kind = D.kind || 'explore';
  const L = {
    recap:   { key: 'Key changes', files: 'Files changed', dia: 'What changed', tests: 'What to test', hunks: 'Annotated changes' },
    plan:    { key: 'What will change', files: 'Files to touch', dia: 'Design', tests: 'Verification', hunks: 'Code sketches' },
    explore: { key: 'Highlights', files: 'Map', dia: 'Diagram', tests: 'Try it', hunks: 'Key code' },
  }[kind] || {};
  const labels = Object.assign({}, L, D.labels || {});
  const navItems = [];
  const sec = (id, title, count) => { navItems.push([id, title]);
    const s = h(`<section id="${id}"><h2>${esc(title)}${count != null ? ` <span class="count">${count}</span>` : ''}</h2></section>`);
    app.appendChild(s); return s; };
  const base = p => p.split('/').pop();
  const dir = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
  const hunkByFile = {};

  /* ---------- hero ---------- */
  const m = D.meta || {};
  const eyebrow = [`<span class="kind ${esc(kind)}">${esc(kind)}</span>`];
  if (m.project) eyebrow.push(`<span>${esc(m.project)}</span>`);
  if (m.branch) eyebrow.push(`<span>⎇ ${esc(m.branch)}${m.base ? ' → ' + esc(m.base) : ''}</span>`);
  if (D.source) eyebrow.push(`<span>◇ ${esc(D.source)}</span>`);
  const st = D.stats || {};
  const stats = [];
  if (st.files != null) stats.push(`<div class="stat"><b>${st.files}</b><span>files</span></div>`);
  if (st.add != null) stats.push(`<div class="stat add"><b>+${st.add}</b><span>added</span></div>`);
  if (st.del != null) stats.push(`<div class="stat del"><b>−${st.del}</b><span>removed</span></div>`);
  if (st.commits) stats.push(`<div class="stat"><b>${st.commits}</b><span>commits</span></div>`);
  if (kind === 'plan' && (D.steps || []).length) stats.push(`<div class="stat"><b>${D.steps.length}</b><span>steps</span></div>`);
  if (kind === 'plan' && (D.files || []).length && st.files == null) stats.push(`<div class="stat"><b>${D.files.length}</b><span>files</span></div>`);
  if ((D.questions || []).length) stats.push(`<div class="stat"><b>${D.questions.length}</b><span>open questions</span></div>`);
  app.appendChild(h(`<header class="hero"><div class="eyebrow">${eyebrow.join('<span>·</span>')}</div>
    <h1>${inline(D.title || 'Visual')}</h1>${D.subtitle ? `<p class="sub">${inline(D.subtitle)}</p>` : ''}
    <div class="stats">${stats.join('')}</div></header>`));

  if (D.summary) sec('summary', 'Summary').appendChild(h(`<div class="card summary prose">${md(D.summary)}</div>`));

  /* ---------- key changes + files ---------- */
  const keys = D.keyChanges || [];
  const files = D.files || [];
  if (keys.length || files.length) {
    const s = sec('changes', keys.length ? labels.key : labels.files);
    const grid = h(`<div class="split"></div>`); s.appendChild(grid);
    if (keys.length) {
      const col = h(`<div class="changes"></div>`);
      keys.forEach((k, i) => {
        const tag = k.tag ? `<span class="tag t-${esc(String(k.tag).toLowerCase())}">${esc(k.tag)}</span>` : '';
        const chips = (k.files || []).map(f => `<span class="chip" data-file="${esc(f)}" title="${esc(f)}">${esc(base(f))}</span>`).join('');
        col.appendChild(h(`<div class="card change"><div class="num">${String(i + 1).padStart(2, '0')}</div><div>
          <h3>${inline(k.title)} ${tag}</h3>${k.detail ? `<div class="detail prose">${md(k.detail)}</div>` : ''}
          ${chips ? `<div class="chips">${chips}</div>` : ''}</div></div>`));
      });
      grid.appendChild(col);
    }
    if (files.length) grid.appendChild(renderFiles(files));
    if (!keys.length) grid.style.gridTemplateColumns = '1fr';
  }

  function normStatus(f) {
    const s = String(f.status || 'M').toUpperCase();
    return ({ ADD: 'A', ADDED: 'A', NEW: 'A', CREATE: 'A', MODIFY: 'M', MODIFIED: 'M', CHANGE: 'M', EDIT: 'M',
      DELETE: 'D', DELETED: 'D', REMOVE: 'D', RENAME: 'R', RENAMED: 'R' })[s] || s[0];
  }

  const PHASES = [
