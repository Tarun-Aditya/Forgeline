mutation {
  lumen_books_createOrder(customerId: "c-802", items: [{ bookId: "b-803", quantity: 1 }]) {
    id
    customerId
    status
    items {
      bookId
      quantity
      unitPriceCents
    }
    totalCents
    payment {
      type
      last4
      brand
      iban
    }
    createdAt
  }
}
