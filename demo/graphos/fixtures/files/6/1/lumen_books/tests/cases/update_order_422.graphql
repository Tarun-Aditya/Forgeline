# expect-upstream-status: 422
mutation {
  lumen_books_updateOrder(
    orderId: "orderId-422"
    status: shipped
    note: "note-424"
  ) {
    id
    customerId
    status
    items {
      bookId
      quantity
      unitPriceCents
    }
    totalCents
    payment {
      type
      last4
      brand
      iban
    }
    createdAt
  }
}
