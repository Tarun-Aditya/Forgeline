# rover connector test suite — layer 2 of the validation stack.
# Started by graphos-factory-core scaffold on 2026-10-21 and audited at the first apply.
# The framework injects $config but not $env; scripts/unit.sh rewrites the
# schema's {$env.…} to {$config.…} in a temporary copy, backed by the value below.
config:
  schema: lumen-books.graphql
  common:
    variables:
      $config:
        LUMEN_BOOKS_TOKEN: test-token
tests:

  - name: "lumen_books_books request shape and mapping"
    target: "Query.lumen_books_books"
    variables:
      $args:
        page: 1
        limit: 2
        genre: genre-3
        ids: ids-4
    apiResponseBody: |
      {
        "data": [
          {
            "id": "id-1",
            "title": "title-1",
            "authorId": "authorId-1",
            "isbn": "isbn-1",
            "priceCents": 1,
            "currency": "USD",
            "genres": [
              "genres-1"
            ],
            "publishedAt": "2026-01-01",
            "stock": 1,
            "metadata": {}
          }
        ],
        "meta": {
          "page": 1,
          "limit": 1,
          "total": 1
        }
      }
    expect:
      connectorRequest:
        method: GET
        url: http://127.0.0.1:4010/books?page=1&limit=2&genre=genre-3&ids=ids-4
        headers:
          authorization: Bearer test-token
      connectorResponse: |
        {
          "data": [
            {
              "id": "id-1",
              "title": "title-1",
              "authorId": "authorId-1",
              "isbn": "isbn-1",
              "priceCents": 1,
              "currency": "USD",
              "genres": [
                "genres-1"
              ],
              "publishedAt": "2026-01-01",
              "stock": 1
            }
          ],
          "page": 1,
          "limit": 1,
          "total": 1
        }

  - name: "lumen_books_book request shape and mapping"
    target: "Query.lumen_books_book"
    variables:
      $args:
        bookId: bookId-1
    apiResponseBody: |
      {
        "id": "id-1",
        "title": "title-1",
        "authorId": "authorId-1",
        "isbn": "isbn-1",
        "priceCents": 1,
        "currency": "USD",
        "genres": [
          "genres-1"
        ],
        "publishedAt": "2026-01-01",
        "stock": 1,
        "metadata": {}
      }
    expect:
      connectorRequest:
        method: GET
        url: http://127.0.0.1:4010/books/bookId-1
        headers:
          authorization: Bearer test-token
      connectorResponse: |
        {
          "id": "id-1",
          "title": "title-1",
          "authorId": "authorId-1",
          "isbn": "isbn-1",
          "priceCents": 1,
          "currency": "USD",
          "genres": [
            "genres-1"
          ],
          "publishedAt": "2026-01-01",
          "stock": 1
        }

