name: factory-evals

# Gate any change to the factory's own configuration on a clean pass.
on:
  pull_request:
    paths: [".claude/**", "factory/**", "AGENTS.md", "CLAUDE.md"]
  push:
    branches: [main]
    paths: [".claude/**", "factory/**", "AGENTS.md", "CLAUDE.md"]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 factory/evals/run_evals.py -v
