  - name: "lumen_books_searchBooks request body and mapping"
    target: "Query.lumen_books_searchBooks"
    variables:
      $args:
        query: dune
        genre: scifi
    apiResponseBody: |
      {"data": [{"id": "b-401", "title": "Dune Sea", "authorId": "a-4", "isbn": "978-0-00-000401", "priceCents": 1499, "currency": "EUR", "genres": ["scifi"], "publishedAt": "1999-04-01", "stock": 3}], "meta": {"page": 1, "limit": 10, "total": 1}}
    expect:
      connectorRequest:
        method: POST
        url: http://127.0.0.1:4010/books/search
        headers:
          authorization: Bearer test-token
        body: |
          {"query": "dune", "genre": "scifi"}
      connectorResponse: |
        {"data": [{"id": "b-401", "title": "Dune Sea", "authorId": "a-4", "isbn": "978-0-00-000401", "priceCents": 1499, "currency": "EUR", "genres": ["scifi"], "publishedAt": "1999-04-01", "stock": 3}], "page": 1, "limit": 10, "total": 1}

  - name: "lumen_books_updateOrder request body and mapping"
    target: "Mutation.lumen_books_updateOrder"
    variables:
      $args:
        orderId: o-901
        status: shipped
        note: leave at the door
    apiResponseBody: |
      {"id": "o-901", "customerId": "c-901", "status": "shipped", "items": [{"bookId": "b-9011", "quantity": 2, "unitPriceCents": 1299}], "totalCents": 2598, "payment": {"type": "bank", "iban": "DE89370400440532013000"}, "createdAt": "2026-03-04T10:20:30Z"}
    expect:
      connectorRequest:
        method: PATCH
        url: http://127.0.0.1:4010/orders/o-901
        headers:
          authorization: Bearer test-token
        body: |
          {"status": "shipped", "note": "leave at the door"}
      connectorResponse: |
        {"id": "o-901", "customerId": "c-901", "status": "shipped", "items": [{"bookId": "b-9011", "quantity": 2, "unitPriceCents": 1299}], "totalCents": 2598, "payment": {"type": "bank", "iban": "DE89370400440532013000"}, "createdAt": "2026-03-04T10:20:30Z"}

  - name: "Lumen_Books_Book.author relationship field"
    target: "Lumen_Books_Book.author"
    variables:
      $this:
        authorId: a-1201
    apiResponseBody: |
      {"id": "a-1201", "name": "Tove Berg", "bio": "Poet.", "born": 1980}
    expect:
      connectorRequest:
        method: GET
        url: http://127.0.0.1:4010/authors/a-1201
        headers:
          authorization: Bearer test-token
      connectorResponse: |
        {"id": "a-1201", "name": "Tove Berg", "bio": "Poet.", "born": 1980}

  - name: "Lumen_Books_OrderItem.book relationship field"
    target: "Lumen_Books_OrderItem.book"
    variables:
      $this:
        bookId: b-1301
    apiResponseBody: |
      {"id": "b-1301", "title": "River Atlas", "authorId": "a-1301", "isbn": "978-0-00-001301", "priceCents": 1499, "currency": "EUR", "genres": ["fiction"], "publishedAt": "1999-04-01", "stock": 12, "metadata": {"imprint": "Lumen"}}
    expect:
      connectorRequest:
        method: GET
        url: http://127.0.0.1:4010/books/b-1301
        headers:
          authorization: Bearer test-token
      connectorResponse: |
        {"id": "b-1301", "title": "River Atlas", "authorId": "a-1301", "isbn": "978-0-00-001301", "priceCents": 1499, "currency": "EUR", "genres": ["fiction"], "publishedAt": "1999-04-01", "stock": 12}

  # D-wnrxww / D-x1ekw6: no root field here selects a Book by its key alone, so
  # the router never calls this lookup from this subgraph's own queries and no
  # e2e case can reach it; this entry proves the request and the mapping only.
  # One key: rover's URI assertion cannot compare a joined list (it encodes the
  # expected comma and not the sent one), so the comma join is not asserted here.
  - name: "Lumen_Books_Book $batch lookup"
    target: "Lumen_Books_Book"
    variables:
      $batch:
        - id: b-1501
    apiResponseBody: |
      {"data": [{"id": "b-1501", "title": "One", "authorId": "a-1", "isbn": "978-0-00-001501", "priceCents": 1000, "currency": "EUR", "genres": ["essay"], "publishedAt": "2000-01-01", "stock": 1, "metadata": {}}], "meta": {"page": 1, "limit": 50, "total": 1}}
    expect:
      connectorRequest:
        method: GET
        url: http://127.0.0.1:4010/books?ids=b-1501&limit=50
        headers:
          authorization: Bearer test-token
      connectorResponse: |
        [{"id": "b-1501", "title": "One", "authorId": "a-1", "isbn": "978-0-00-001501", "priceCents": 1000, "currency": "EUR", "genres": ["essay"], "publishedAt": "2000-01-01", "stock": 1}]
